name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .
      - name: Check shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/export-keymaps.sh

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    env:
      XDG_CONFIG_HOME: ${{ runner.temp }}/xdg/config
      XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
      XDG_STATE_HOME: ${{ runner.temp }}/xdg/state
      XDG_CACHE_HOME: ${{ runner.temp }}/xdg/cache
    steps:
      - uses: actions/checkout@v6
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fd-find fzf ripgrep
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
      - name: Link configuration
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          ln -s "$GITHUB_WORKSPACE" "$XDG_CONFIG_HOME/nvim"
      - name: Restore plugins
        run: nvim --headless -i NONE "+Lazy! restore" +qa!
      - name: Start Neovim
        run: nvim --headless -i NONE "+qa!"
